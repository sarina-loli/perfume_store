# Render Blueprint for the Victoria frontend (React + Vite + React Router).
# Place this file at the ROOT of the repo (next to /frontend and /backend).
#
# The important part is the `routes` rewrite: a static host only knows real
# files, so a request for /about finds nothing and returns 404. Rewriting every
# path to /index.html lets React load and React Router render the right page.
# Files that really exist (JS, CSS, images) are still served as-is.

services:
  - type: web
    runtime: static
    name: perfume-store-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # set in the dashboard, e.g. https://<your-backend>.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html